name: Render Keep-Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render keep-alive endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 2 \
            https://real-estate-system-21r0.onrender.com/ping
